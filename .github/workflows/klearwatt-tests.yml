name: KlearWatt tests

on:
  push:
    branches:
      - klearwatt-safe-work-2026-11-19
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run automated tests
        run: npm test
